version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # FastAPI REST Service & HTML Voice Assistant
  # ----------------------------------------------------------------------------
  voice-copilot-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novacart-voice-copilot-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - LOG_LEVEL=INFO
    volumes:
      - ./vector_store:/app/vector_store
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ----------------------------------------------------------------------------
  # Streamlit Operations Dashboard (Optional / Secondary UI)
  # ----------------------------------------------------------------------------
  voice-copilot-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: novacart-voice-copilot-ui
    restart: unless-stopped
    command: ["streamlit", "run", "ui/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - ./vector_store:/app/vector_store
    depends_on:
      voice-copilot-api:
        condition: service_healthy
