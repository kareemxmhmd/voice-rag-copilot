[project]
name = "voice-rag-copilot"
version = "0.1.0"
description = "Low-Latency Voice RAG Copilot for E-commerce & Subscription Operations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "chromadb>=0.5.0",
    "google-genai>=1.0.0",
    "edge-tts>=7.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.12",
    "streamlit>=1.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
